<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Podcastify</title>
  </head>
  <body>
    <header>
      <span class="logo">🎧</span>
      <h1>Podcastify</h1>
    </header>

    <p id="title" class="title" title="">Ready to listen</p>

    <div class="statusbar">
      <span id="status" class="status">Ready</span>
      <span id="section" class="section">—</span>
    </div>

    <div class="controls">
      <button id="prev" class="ctl" title="Previous section" aria-label="Previous section">⏮</button>
      <button id="play" class="ctl primary" title="Play" aria-label="Play">▶</button>
      <button id="pause" class="ctl primary" title="Pause" aria-label="Pause" hidden>⏸</button>
      <button id="stop" class="ctl" title="Stop" aria-label="Stop">⏹</button>
      <button id="next" class="ctl" title="Next section" aria-label="Next section">⏭</button>
    </div>

    <div class="settings">
      <label class="field">
        <span>Voice</span>
        <select id="voice"></select>
      </label>

      <label class="field">
        <span>Speed <output id="rateOut">1.0×</output></span>
        <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1" />
      </label>

      <label class="field">
        <span>Pitch <output id="pitchOut">1.0</output></span>
        <input id="pitch" type="range" min="0" max="2" step="0.1" value="1" />
      </label>
    </div>

    <button id="rescan" class="link" title="Scan again for newly loaded content">
      ↻ Scan page again
    </button>

    <p id="error" class="error" hidden></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
