        - paragraph [ref=e41]: गंगा आरती का गायन मन को शुद्ध और शांत करता है, पापों के नाश और पुण्य की प्राप्ति का भाव जगाता है, तथा श्रद्धा व भक्ति बढ़ाता है। स्नान और पूजा के समय इसका गायन शुभ माना जाता है।
      - generic [ref=e42]:
