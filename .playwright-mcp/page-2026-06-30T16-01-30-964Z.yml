          - generic [ref=e32]: सुनें
      - generic [ref=e33]:
        - heading "बोल" [level=2] [ref=e34]
        - generic [ref=e35]: ॐ जय गंगे माता, मैया जय गंगे माता। जो नर तुमको ध्याता, मनवांछित फल पाता॥ ॐ जय गंगे माता॥ चन्द्र-सी ज्योति तुम्हारी, जल निर्मल आता। शरण पड़े जो तेरी, सो नर तर जाता॥ ॐ जय गंगे माता॥ पुत्र सगर के तारे, सब जग को ज्ञाता। कृपा दृष्टि हो तुम्हारी, त्रिभुवन सुखदाता॥ ॐ जय गंगे माता॥ एक ही बार जो तेरी, शरणागति आता। यम की त्रास मिटाकर, परमगति पाता॥ ॐ जय गंगे माता॥ आरती मातु तुम्हारी, जो जन नित गाता। दास वही सहज में, मुक्ति को पाता॥ ॐ जय गंगे माता॥
      - generic [ref=e36]:
        - heading "अर्थ" [level=2] [ref=e37]
        - paragraph [ref=e38]: इस आरती में भक्त माँ गंगा की वंदना करता है, जिनका जल निर्मल और पवित्र है। जो उनका ध्यान करता और शरण में आता है, वह संसार-सागर से तर जाता है और परमगति प्राप्त करता है। गंगा को मोक्षदायिनी और त्रिभुवन को सुख देने वाली कहा गया है।
      - generic [ref=e39]:
