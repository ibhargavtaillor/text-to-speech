        - paragraph [ref=e29]: ॐ जय गंगे माता गंगा आरती के बोल हिंदी में अर्थ सहित। माँ गंगा की पवित्र आरती, जो स्नान, पूजा और गंगा दशहरा पर गाई जाती है।
